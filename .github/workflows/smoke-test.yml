name: Smoke test

# Provisions a real site end-to-end against the actual stack and exercises
# the exact failure classes found by hand during development: cron running
# a site under the wrong PHP version, `clone` leaving an invalid nginx
# vhost, and nginx caching a stale upstream IP after a phpXX container
# restart. A green run here is a real guarantee those don't regress --
# every prior incident in this list was first caught by someone manually
# poking at a live stack, not by anything automatic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .env
        run: cp .env.example .env

      - name: Install mkcert and trust the local CA
        run: ./wpdev install-mkcert

      - name: Provision a test site (domain, PHP version, continue, skip /etc/hosts)
        run: printf 'citest.test\n8.2\ny\nn\n' | ./wpdev add

      - name: Site responds over HTTPS
        # Retries: curl can hit a transient SSL-connect error (exit 35) in
        # the few seconds right after cert generation + nginx reload --
        # seen for real in CI once, on a commit that touched nothing but
        # completions/README, confirming it was a startup race, not a
        # regression. Same reasoning as wait_for_mysql's retry loop.
        run: |
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code"
          [ "$code" = "200" ]

      - name: doctor reports no failures
        # Not "Everything checks out": this stack deliberately never starts
        # adminer/portainer (wpdev add doesn't need them) and skips the
        # /etc/hosts entry (curl --resolve is used instead), both of which
        # doctor correctly reports as warnings, not failures. Asserting on
        # the absence of "need fixing" (only printed when fails > 0) checks
        # what's actually meaningful here without requiring a fuller stack
        # than this test needs.
        run: ./wpdev doctor | tee /tmp/doctor.log; ! grep -q "thing(s) need fixing" /tmp/doctor.log

      - name: Redis object cache connected
        run: ./wpdev wp citest redis status | grep -q "Connected"

      - name: >
          Regression test -- clone must produce a valid nginx vhost
          (a past bug left the PHP_UPSTREAM placeholder unsubstituted,
          which silently invalidated nginx's entire config)
        run: |
          printf 'y\nn\n' | ./wpdev clone citest citest-clone
          docker exec wp-nginx nginx -t
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest-clone.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest-clone.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "clone HTTP $code"
          [ "$code" = "200" ]

      - name: >
          Regression test -- cron must run each site under its own PHP
          version, with no xdebug.log permission-race warnings
        run: |
          sleep 70
          cat logs/cron.log
          grep -q "citest (php8.2)" logs/cron.log
          grep -q "citest-clone (php8.2)" logs/cron.log
          ! grep -q "could not be opened" logs/cron.log
          ! grep -q "syntax error" logs/cron.log
          ! grep -qE "You are running 8\.[^2]" logs/cron.log

      - name: >
          Regression test -- restarting a phpXX container must not break
          nginx routing (a past bug cached the old container's IP until
          nginx was manually reloaded)
        run: |
          docker compose restart php82
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP after php82 restart, no nginx reload: $code"
          [ "$code" = "200" ]

      - name: Remove both sites and confirm doctor reports no failures
        run: |
          printf 'citest-clone.test\n' | ./wpdev remove citest-clone
          printf 'citest.test\n' | ./wpdev remove citest
          ./wpdev doctor | tee /tmp/doctor2.log
          ! grep -q "thing(s) need fixing" /tmp/doctor2.log

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "--- docker compose ps ---"
          docker compose ps
          echo "--- cron.log ---"
          cat logs/cron.log 2>/dev/null || true
          echo "--- nginx error log ---"
          cat logs/nginx/*error.log 2>/dev/null || true
          echo "--- doctor ---"
          ./wpdev doctor || true

      - name: Tear down
        if: always()
        run: docker compose down -v --rmi local
