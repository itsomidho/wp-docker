user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Paired with `set $upstream_php ...;` in the
    # site template (a variable in fastcgi_pass forces per-request lookup
    # instead of caching the upstream's IP for the life of the worker), so
    # restarting a phpXX container doesn't require a matching nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Opt-in full-page cache (see `wpdev cache`) -- one shared zone for every
    # site, not one per site. Purging (`wpdev cache-purge`) clears all of it
    # at once; for a single-developer local box that's a non-issue, and it
    # avoids per-site cache_path declarations for a feature most sites won't
    # even have turned on.
    fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WPCACHE:100m inactive=60m max_size=1g;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Every *.conf here is served — one file per site, no enable/disable step.
    include /etc/nginx/sites/*.conf;
}
