zend_extension=xdebug

xdebug.mode=debug,develop
; "trigger" instead of "yes": Xdebug only attaches when a request carries the
; XDEBUG_TRIGGER cookie/query param (e.g. via the Xdebug helper browser
; extension). Keeps normal page loads fast; debugging still works on demand.
xdebug.start_with_request=trigger

xdebug.client_host=host.docker.internal
xdebug.client_port=9003

xdebug.idekey=VSCODE
xdebug.discover_client_host=0

; No xdebug.log: /tmp/xdebug.log was shared between php-fpm (www-data) and
; cron (root) in the same container -- whichever process created it first
; owned it at mode 644, and the other user then failed to open it on every
; single attempt, flooding logs/cron.log with a warning every minute.
; Trigger-based debugging doesn't need the log file to work.
